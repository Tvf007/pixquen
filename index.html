<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maquininha PIX - Cobranças e Pagamentos</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #030712 !important;
        color: #ffffff;
      }
      html.dark,
      html.dark body {
        background-color: #030712 !important;
        color: #ffffff;
      }
    </style>
    <script>
      // Aplicar tema dark imediatamente para evitar tela branca
      (function () {
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        // Sempre aplicar tema dark como padrão
        applyThemeToDOM("dark");

        // Se estiver em iframe, também ouvir mensagens do pai
        try {
          if (window.self !== window.top) {
            window.addEventListener("message", function (event) {
              if (event.data && typeof event.data.theme === "string") {
                const theme = event.data.theme;
                if (theme === "light" || theme === "dark") {
                  applyThemeToDOM(theme);
                }
              }
            });
          }
        } catch (e) {
          // Ignorar erros de cross-origin
        }
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #030712; color: white; font-family: system-ui, sans-serif;">
        <div style="text-align: center;">
          <div style="font-size: 48px; margin-bottom: 16px;">⏳</div>
          <div>Carregando Maquininha PIX...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
